steps:
  # ─────────────────────────────────────────────────────────────
  # 1. Build the FastUI Worker container image with Playwright
  # ─────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-worker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'
      - '-f'
      - 'services/worker/Dockerfile'
      - 'services/worker'

  # ─────────────────────────────────────────────────────────────
  # 2. Push image to Google Artifact Registry
  # ─────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-worker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}'

  # ─────────────────────────────────────────────────────────────
  # 3. Deploy to Google Cloud Run (Private / IAM Authenticated)
  # ─────────────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=8001'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=300s'
      - '--concurrency=3'
      - '--no-allow-unauthenticated'

# Artifact Registry Images
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'

substitutions:
  _REGION: 'asia-south1'
  _SERVICE_NAME: 'fastui-worker'
  _ARTIFACT_REPO: 'fastui'

options:
  logging: 'CLOUD_LOGGING_ONLY'
