[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "venv",
    "alembic",
    "scratch",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # line too long
    "E402", # module level import not at top of file
    "E741", # ambiguous variable name
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "B904", # within except clause, raise from
    "UP042", # class inherits from both str and Enum (required for SQLAlchemy Enum column compatibility)
    "UP007", # Use X | Y for type annotations (FastAPI response_model Union compatibility)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
