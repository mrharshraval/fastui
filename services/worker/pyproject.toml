[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "error",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "venv",
    "scratch",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # line too long
    "E402", # module level import not at top of file
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "B904", # within except clause, raise from
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
